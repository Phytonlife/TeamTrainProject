services:
  - type: web
    name: onepiece-orders # Simplified name
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --noinput
      chmod +x ./start.sh # Make the start script executable
    startCommand: './start.sh' # Run the start script
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: onepiece-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.4
      # Secrets for the bot, now running in the web service
      - key: TELEGRAM_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      # Internal communication URL for the bot listener
      # The bot now runs in the same container, so it can talk to itself via localhost
      - key: BOT_LISTENER_URL
        value: http://localhost:8001/notify

databases:
  - name: onepiece-db
    databaseName: onepiece
    user: onepiece_user
    plan: free
