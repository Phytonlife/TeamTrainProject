services:
  - type: web
    name: onepiece-django
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --noinput
    startCommand: 'gunicorn backend.wsgi:application'
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: onepiece-django
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: onepiece-db
          property: connectionString
      - key: DJANGO_APP_URL
        fromService:
          type: web
          name: onepiece-django
          property: url
      - key: BOT_LISTENER_URL
        fromService:
          type: worker
          name: onepiece-bot
          property: url
      - key: PYTHON_VERSION
        value: 3.11.4


  - type: worker
    name: onepiece-bot
    env: python
    plan: free
    buildCommand: 'pip install -r requirements.txt'
    startCommand: 'python bot/bot.py'
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false # Keep secret in Render dashboard
      - key: CHANNEL_ID
        sync: false # Keep secret in Render dashboard
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: onepiece-django
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: onepiece-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.4

databases:
  - name: onepiece-db
    databaseName: onepiece
    user: onepiece_user
    plan: free
